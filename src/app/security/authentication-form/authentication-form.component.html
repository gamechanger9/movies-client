<h2>{{ title }}</h2>

<form (submit)="saveChanges()" [formGroup]="form">
    <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput [formControl]="form.controls.email" />
        <mat-error>{{getErrorMessagesForEmail()}}</mat-error>

    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [formControl]="form.controls.password" type="password" />
        <mat-error>{{getErrorMessagesForPassword()}}</mat-error>

    </mat-form-field>

    <div class="buttons-container">
        <button mat-flat-button type="submit" [disabled]="form.invalid">@if(title === 'Login') { Login } @else { Register }</button>
        <a mat-stroked-button routerLink="/">Cancel</a>
    </div>
</form>
