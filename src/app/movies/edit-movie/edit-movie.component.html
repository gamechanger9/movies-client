<h2>Edit a Movie</h2>

@if(model){
    <app-movies-form [unSelectedGenres]="nonSelectedGenres" [selectedGenres]="selectedGenres"
    [selectedTheaters]="selectedTheaters" [unSelectedTheaters]="nonSelectedTheaters"
    [selectedActors]="selectedActors" (postForm)="saveChanges($event)" [model]="model"></app-movies-form>
} @else {
    <app-loading></app-loading>
}
